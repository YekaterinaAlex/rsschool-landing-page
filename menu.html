<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee house-menu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/icons/favicon.svg">
</head>

<body>
  <header>
    <a href="index.html" class="logo" aria-label="Coffee House home">
      <img class="logo-light" src="assets/icons/logo.svg" alt="Coffee House">

      <img class="logo-dark" src="assets/icons/logo-dark.svg" alt="">
    </a>
    <nav>
      <ul class="header-navigation">
        <li>
          <a href="index.html#favorite">Favorite coffee</a>
        </li>
        <li>
          <a href="index.html#about">About</a>
        </li>
        <li>
          <a href="index.html#mobile-app">Mobile app</a>
        </li>
        <li>
          <a href="#contacts">Contact us</a>
        </li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="menu.html" class="menu-link">
        <span>Menu</span>
        <img src="assets/icons/coffee-cup.svg" alt="">
      </a>

      <button type="button" class="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
        <img class="theme-switch-light" src="assets/icons/theme-light.svg" alt="">

        <img class="theme-switch-dark" src="assets/icons/theme-dark.svg" alt="">
      </button>

      <button type="button" class="burger-button" aria-label="Open menu">
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <div class="mobile-menu">

    <nav class="mobile-navigation">
      <a href="index.html#favorite">Favorite coffee</a>
      <a href="index.html#about">About</a>
      <a href="index.html#mobile-app">Mobile app</a>
      <a href="#contacts">Contact us</a>
      <a href="menu.html">Menu</a>
    </nav>
  </div>

  <main>
    <section class="menu">
      <h1>
        Behind each of our cups hides an <span>amazing surprise</span>
      </h1>


      <div class="menu-tabs">
        <button type="button" class="menu-tab active" data-category="coffee"><span class="tab-icon"><img
              src="assets/icons/coffee.png" alt=""></span><span>Coffee</span></button>
        <button type="button" class="menu-tab" data-category="tea"><span class="tab-icon"><img
              src="assets/icons/tea.png" alt=""></span><span>Tea</span></button>
        <button type="button" class="menu-tab" data-category="dessert"><span class="tab-icon"><img
              src="assets/icons/dessert.png" alt=""></span><span>Dessert</span></button>
      </div>

      <div class="menu-grid">


      </div>
      <button type="button" class="load-more">
        <img src="assets/icons/refresh.svg" alt="">
      </button>
    </section>
  </main>
  <footer id="contacts">
    <div class="footer-socials">
      <h2>Sip, Savor, Smile. <span>It’s coffee time!</span></h2>

      <div class="social-links">
        <a href="https://twitter.com/" aria-label="Twitter">
          <img src="assets/icons/twitter.svg" alt="">
        </a>

        <a href="https://instagram.com/" aria-label="Instagram">
          <img src="assets/icons/instagram.svg" alt="">
        </a>

        <a href="https://facebook.com/" aria-label="Facebook">
          <img src="assets/icons/facebook.svg" alt="">
        </a>
      </div>
    </div>

    <div class="footer-contacts">
      <h3>Contact us</h3>

      <address>
        <a href="https://maps.google.com/" target="_blank" rel="noopener noreferrer">
          <img src="assets/icons/pin-alt.svg" alt=""><span>8558 Green Rd., LA</span>
        </a>

        <a href="tel:+16035550123">
          <img src="assets/icons/phone.svg" alt="">
          <span>+1 (603) 555-0123</span>
        </a>

        <p>
          <img src="assets/icons/clock.svg" alt="">
          <span>Mon-Sat: 9:00 AM – 23:00 PM</span>
        </p>
      </address>
    </div>
  </footer>
  <script src="script.js"></script>
</body>

</html>
